<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #666666;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e7eb;
            --section-bg: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* Hero */
        .hero {
            padding: 120px 0 100px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto 36px;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Sections */
        section {
            padding: 80px 0;
        }

        .section-alt {
            background: var(--section-bg);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 48px;
            letter-spacing: -0.01em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 32px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            transform: translateY(-4px);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .card p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 40px 0;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero {
                padding: 80px 0 60px;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .nav-links {
                gap: 16px;
            }
            section {
                padding: 56px 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav class="nav">
                <a href="#" class="logo">MySite</a>
                <ul class="nav-links">
                    <li><a href="#home">首页</a></li>
                    <li><a href="#features">功能</a></li>
                    <li><a href="#about">关于</a></li>
                    <li><a href="#contact">联系</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="home">
            <div class="container">
                <h1>欢迎来到我的网站</h1>
                <p>这是一个简约现代的 HTML 页面模板，响应式设计，无外部依赖，可直接部署到 GitHub Pages。</p>
                <a href="#features" class="btn">开始探索</a>
            </div>
        </section>

        <section class="section-alt" id="features">
            <div class="container">
                <h2 class="section-title">核心功能</h2>
                <div class="grid">
                    <div class="card">
                        <h3>响应式设计</h3>
                        <p>适配桌面、平板和手机，在各种屏幕尺寸下都有良好表现。</p>
                    </div>
                    <div class="card">
                        <h3>零依赖</h3>
                        <p>纯 HTML + CSS 实现，无需引入任何外部框架或库。</p>
                    </div>
                    <div class="card">
                        <h3>易于扩展</h3>
                        <p>结构清晰、代码简洁，方便根据需求自定义修改。</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="about">
            <div class="container">
                <h2 class="section-title">关于</h2>
                <p style="max-width: 700px; margin: 0 auto; text-align: center; color: var(--muted);">
                    在这里介绍你的项目或内容。替换这段文字即可。
                </p>
            </div>
        </section>
    </main>

    <footer id="contact">
        <div class="container">
            <p>© 2026 MySite. 保留所有权利。</p>
        </div>
    </footer>

</body>
</html>
